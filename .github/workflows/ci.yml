name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # O runner ja tem Docker, entao o Testcontainers funciona sem configuracao extra
      - name: Build e testes
        run: mvn -B verify
